name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build · Test · Pack (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run tests (unit + integration + E2E + dist smoke)
        run: pnpm test

      - name: Pack (verify tarball contents without publishing)
        run: pnpm pack

      - name: Inspect tarball
        run: |
          TGZ=$(ls *.tgz | head -1)
          echo "Tarball: $TGZ"
          tar -tzf "$TGZ" | sort
          tar -tzf "$TGZ" | grep -q "package/dist/cli.js"     || { echo "FAIL: dist/cli.js missing"; exit 1; }
          tar -tzf "$TGZ" | grep -q "package/dist/index.js"   || { echo "FAIL: dist/index.js missing"; exit 1; }
          tar -tzf "$TGZ" | grep -q "package/dist/index.d.ts" || { echo "FAIL: dist/index.d.ts missing"; exit 1; }
          tar -tzf "$TGZ" | grep -q "package/README.md"        || { echo "FAIL: README.md missing"; exit 1; }
          if tar -tzf "$TGZ" | grep -q "package/src/"; then
            echo "FAIL: src/ must not be in package"; exit 1
          fi
          if tar -tzf "$TGZ" | grep -q "package/tests/"; then
            echo "FAIL: tests/ must not be in package"; exit 1
          fi
          echo "Tarball contents OK"
